name: Deploy to Cloudflare
on:
  push:
    branches: [ main ] # Triggered when code is pushed to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      # Execute your first command: run schema (note to add --remote to operate on production database)
      - name: Execute D1 Schema
        run: npx wrangler d1 execute chambers-d1-db --remote --file=./d1-schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Execute your second command: verify data
      - name: Verify D1 Records
        run: npx wrangler d1 execute chambers-d1-db --remote --command="SELECT COUNT(*) FROM matters;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Execute your third command: deploy
      - name: Deploy Worker
        run: npm run deploy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
