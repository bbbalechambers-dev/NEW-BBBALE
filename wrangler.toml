name = "new-bbbale"
main = "src/worker.ts"
compatibility_date = "2026-10-15"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "LAW_DB"
database_name = "bbbalechambers"
database_id = "ca70ad79-15b1-46e1-a2ba-35a9cf99705d"

[vars]
NODE_ENV = "production"
ENABLE_CLOUDSQL = "false"
